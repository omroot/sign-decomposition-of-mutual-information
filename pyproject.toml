[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signed_mi"
version = "0.1.0"
description = "Signed-residual decomposition of mutual information for binary and multi-class classification."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
interpretability = ["shap"]

[tool.setuptools.packages.find]
where = ["src"]
